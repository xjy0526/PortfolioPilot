services:
  - type: web
    runtime: docker
    name: portfolio-pilot
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health/live
    maxShutdownDelaySeconds: 120
    disk:
      name: portfolio-pilot-data
      mountPath: /app/cache
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: qwen
      - key: DISPLAY_TIMEZONE
        value: Asia/Shanghai
      - key: ENABLE_POLYMARKET
        value: false
      - key: ENABLE_TELEGRAM
        value: false
      - key: ENABLE_PARQET
        value: false
      - key: ENABLE_SHADOW_AGENT
        value: false
      - key: QWEN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_MODEL
        value: qwen-plus
      - key: PARQET_PORTFOLIO_CSV
        value: /app/cache/portfolio.csv
      - key: RAG_DOCUMENT_DIR
        value: /app/cache/rag_documents
      - key: BACKTEST_PRICE_CSV
        value: /app/cache/historical_prices.csv
      - key: CACHE_TTL_HOURS
        value: 12
      - key: QWEN_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
