name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint, type check, and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: portfoliopilot_test
          POSTGRES_USER: portfoliopilot
          POSTGRES_PASSWORD: portfoliopilot
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfoliopilot -d portfoliopilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://portfoliopilot:portfoliopilot@localhost:5432/portfoliopilot_test
      TEST_DATABASE_URL: postgresql+asyncpg://portfoliopilot:portfoliopilot@localhost:5432/portfoliopilot_test
      ENVIRONMENT: test
      CODE_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
      EMBEDDING_PROVIDER: hashing
      RAG_ALLOW_HASHING_FALLBACK: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade \
            "pip>=26.1.2,<27" \
            "setuptools>=83,<85"
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0+cpu"
          python -m pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Migration downgrade and upgrade round trip
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Synthetic evaluation smoke
        run: python -m evaluation.run_full_eval --mode synthetic_smoke --output cache/ci_evaluation.json

      - name: Evaluation integrity claims
        run: python scripts/check_evaluation_integrity.py

      - name: Pytest with coverage
        run: python -m pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Coverage report
        run: python -m coverage report

      - name: Dependency audit
        run: python -m pip_audit --local

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build container
    runs-on: ubuntu-latest
    needs: [quality, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t portfolio-pilot:ci .
