name: Deploy PortfolioPilot

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-east1' }}
  SERVICE: portfolio-pilot
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'portfolio-pilot' }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: >-
      ${{ vars.GCP_PROJECT_ID != '' &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          vars.GCP_SERVICE_ACCOUNT != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Resolve image URI
        run: echo "IMAGE_URI=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE}" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          docker build -t "${IMAGE_URI}:${GITHUB_SHA}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy to Cloud Run
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          DATABASE_ARGS=()
          if [[ -n "${DATABASE_URL}" ]]; then
            DATABASE_ARGS+=(--update-env-vars="DATABASE_URL=${DATABASE_URL}")
          fi
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE_URI}:${GITHUB_SHA}" \
            --region="${REGION}" \
            --allow-unauthenticated \
            --memory=1024Mi \
            --cpu=1 \
            --cpu-boost \
            --no-cpu-throttling \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=300 \
            --update-env-vars="ENVIRONMENT=production,AI_PROVIDER=qwen,DISPLAY_TIMEZONE=Asia/Shanghai" \
            --update-env-vars="ENABLE_POLYMARKET=false,ENABLE_TELEGRAM=false,ENABLE_PARQET=false,ENABLE_SHADOW_AGENT=false" \
            --update-env-vars="QWEN_API_KEY=${QWEN_API_KEY},FMP_API_KEY=${FMP_API_KEY}" \
            --update-env-vars="DASHBOARD_USER=${DASHBOARD_USER},DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}" \
            "${DATABASE_ARGS[@]}" \
            --quiet

      - name: Show service URL
        run: |
          URL=$(gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(status.url)')
          echo "### PortfolioPilot deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** ${IMAGE_URI}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
