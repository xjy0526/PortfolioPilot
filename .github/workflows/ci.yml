name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint, type check, and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: portfoliopilot_test
          POSTGRES_USER: portfoliopilot
          POSTGRES_PASSWORD: portfoliopilot
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfoliopilot -d portfoliopilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://portfoliopilot:portfoliopilot@localhost:5432/portfoliopilot_test
      TEST_DATABASE_URL: postgresql+asyncpg://portfoliopilot:portfoliopilot@localhost:5432/portfoliopilot_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Pytest with coverage
        run: python -m pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Coverage report
        run: python -m coverage report

  docker:
    name: Build container
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t portfolio-pilot:ci .
