name: portfoliopilot

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfoliopilot}
      POSTGRES_USER: ${POSTGRES_USER:-portfoliopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfoliopilot}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  portfolio_postgres_data:
