services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: portfoliopilot_restart_e2e
      POSTGRES_USER: portfoliopilot
      POSTGRES_PASSWORD: portfoliopilot
      TZ: UTC
      PGTZ: UTC
    volumes:
      - restart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U portfoliopilot -d portfoliopilot_restart_e2e
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: e2e
    environment:
      DATABASE_URL: postgresql+asyncpg://portfoliopilot:portfoliopilot@postgres:5432/portfoliopilot_restart_e2e
      TEST_DATABASE_URL: postgresql+asyncpg://portfoliopilot:portfoliopilot@postgres:5432/portfoliopilot_restart_e2e
      ENVIRONMENT: test
      CODE_VERSION: ${CODE_VERSION:-postgres-restart-e2e}
      READ_ONLY_DEMO: "false"
      EMBEDDING_PROVIDER: hashing
      RAG_ALLOW_HASHING_FALLBACK: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OBJECT_STORAGE_BACKEND: local
      OBJECT_STORAGE_LOCAL_ROOT: /app/data/object_storage
      OBJECT_STORAGE_BUCKET: restart-e2e
      RAG_SUCCESS_SOURCE_RETENTION_DAYS: "7"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - restart_object_storage:/app/data/object_storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  restart_postgres_data:
  restart_object_storage:
