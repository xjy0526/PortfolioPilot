name: Deploy PortfolioPilot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-east1' }}
  SERVICE: portfolio-pilot
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'portfolio-pilot' }}
  DATABASE_URL_SECRET: ${{ vars.GCP_DATABASE_URL_SECRET || 'portfoliopilot-database-url' }}
  QWEN_API_KEY_SECRET: ${{ vars.GCP_QWEN_API_KEY_SECRET || 'portfoliopilot-qwen-api-key' }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          vars.GCP_PROJECT_ID != '' &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          vars.GCP_SERVICE_ACCOUNT != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Resolve image URI
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "IMAGE_URI=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE}" >> "$GITHUB_ENV"
          echo "DEPLOY_SHA=${DEPLOY_SHA}" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          docker build -t "${IMAGE_URI}:${DEPLOY_SHA}" .
          docker push "${IMAGE_URI}:${DEPLOY_SHA}"

      - name: Deploy migration job
        run: |
          gcloud run jobs deploy "${SERVICE}-migrate" \
            --image="${IMAGE_URI}:${DEPLOY_SHA}" \
            --region="${REGION}" \
            --command=alembic \
            --args=upgrade,head \
            --set-env-vars="ENVIRONMENT=production,READ_ONLY_DEMO=true,RAG_ALLOW_HASHING_FALLBACK=false" \
            --set-secrets="DATABASE_URL=${DATABASE_URL_SECRET}:latest" \
            --max-retries=0 \
            --task-timeout=600s \
            --quiet

      - name: Run migrations
        run: |
          gcloud run jobs execute "${SERVICE}-migrate" \
            --region="${REGION}" \
            --wait \
            --quiet

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE_URI}:${DEPLOY_SHA}" \
            --region="${REGION}" \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --cpu-boost \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300 \
            --update-env-vars="ENVIRONMENT=production,READ_ONLY_DEMO=true,ALLOW_RUNTIME_SECRET_CONFIGURATION=false,ALLOW_DEV_IDENTITY_HEADERS=false" \
            --update-env-vars="AI_PROVIDER=qwen,DISPLAY_TIMEZONE=Asia/Shanghai,EMBEDDING_PROVIDER=sentence_transformers,RAG_ALLOW_HASHING_FALLBACK=false" \
            --update-env-vars="ENABLE_POLYMARKET=false,ENABLE_TELEGRAM=false,ENABLE_PARQET=false,ENABLE_SHADOW_AGENT=false" \
            --set-secrets="DATABASE_URL=${DATABASE_URL_SECRET}:latest,QWEN_API_KEY=${QWEN_API_KEY_SECRET}:latest" \
            --quiet

      - name: Readiness and read-only smoke test
        run: |
          URL=$(gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(status.url)')
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${URL}/health/ready" > /tmp/readiness.json; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              cat /tmp/readiness.json || true
              exit 1
            fi
            sleep 10
          done
          STATUS=$(curl --silent --output /tmp/read-only-smoke.json --write-out '%{http_code}' \
            -X POST "${URL}/api/market-data/sync" \
            -H 'Content-Type: application/json' \
            -d '{}')
          test "${STATUS}" = "403"
          echo "### PortfolioPilot deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** ${IMAGE_URI}:${DEPLOY_SHA}" >> "$GITHUB_STEP_SUMMARY"
