name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-type-unit:
    name: Lint, type check, and unit tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      CODE_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
      EMBEDDING_PROVIDER: hashing
      RAG_ALLOW_HASHING_FALLBACK: "true"
      COVERAGE_FILE: .coverage.unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade \
            "pip>=26.1.2,<27" \
            "setuptools>=83,<85"
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0+cpu"
          python -m pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Synthetic evaluation smoke
        run: >-
          python -m evaluation.run_full_eval
          --mode synthetic_smoke
          --output cache/ci_evaluation.json

      - name: Evaluation integrity claims
        run: python scripts/check_evaluation_integrity.py

      - name: Non-PostgreSQL tests
        run: >-
          python -m pytest -o addopts="" -m "not postgres"
          --cov=. --cov-report=term-missing
          --durations=20 --durations-min=0.05
          --junitxml=non-postgres.xml

      - name: Summarize non-PostgreSQL tests
        if: ${{ always() && hashFiles('non-postgres.xml') != '' }}
        run: >-
          python scripts/summarize_test_results.py non-postgres.xml
          --label non-postgres
          --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: portfoliopilot_test
          POSTGRES_USER: portfoliopilot
          POSTGRES_PASSWORD: portfoliopilot
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfoliopilot -d portfoliopilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://portfoliopilot:portfoliopilot@localhost:5432/portfoliopilot_test
      TEST_DATABASE_URL: postgresql+asyncpg://portfoliopilot:portfoliopilot@localhost:5432/portfoliopilot_test
      ENVIRONMENT: test
      CODE_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
      EMBEDDING_PROVIDER: hashing
      RAG_ALLOW_HASHING_FALLBACK: "true"
      COVERAGE_FILE: .coverage.postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade \
            "pip>=26.1.2,<27" \
            "setuptools>=83,<85"
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0+cpu"
          python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Migration downgrade and upgrade round trip
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: PostgreSQL integration tests
        run: >-
          python -m pytest -o addopts=""
          -m "postgres and not postgres_restart"
          --cov=. --cov-report=term-missing
          --durations=20 --durations-min=0.05
          --junitxml=postgres.xml

      - name: Summarize PostgreSQL integration tests
        if: ${{ always() && hashFiles('postgres.xml') != '' }}
        run: >-
          python scripts/summarize_test_results.py postgres.xml
          --label postgres-integration
          --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload PostgreSQL coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-postgres
          path: .coverage.postgres
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  postgres-restart-e2e:
    name: PostgreSQL restart persistence E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODE_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
      POSTGRES_RESTART_E2E_PROJECT: pprestart-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E orchestrator dependency
        run: python -m pip install "pytest>=8.0,<9.0"

      - name: Validate E2E Compose configuration
        run: docker compose -f docker-compose.e2e.yml config --quiet

      - name: Run real PostgreSQL restart persistence E2E
        run: >-
          python -m pytest
          --confcutdir=tests/e2e
          -o addopts=""
          -m postgres_restart
          -q -s
          --durations=10 --durations-min=0.05
          --junitxml=postgres-restart.xml
          tests/e2e/test_postgres_restart_persistence.py

      - name: Summarize PostgreSQL restart E2E
        if: ${{ always() && hashFiles('postgres-restart.xml') != '' }}
        run: >-
          python scripts/summarize_test_results.py postgres-restart.xml
          --label postgres-restart-e2e
          --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Record E2E scope
        run: |
          echo "### PostgreSQL restart persistence E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified transaction, rebuilt position, valuation, research chunk, pgvector embedding, prompt version, LLM trace, workflow, human review, and published report across a real Compose PostgreSQL restart." >> "$GITHUB_STEP_SUMMARY"

  coverage-report:
    name: Combined coverage report
    runs-on: ubuntu-latest
    needs: [lint-type-unit, postgres-integration]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install "coverage>=7.5,<8.0"

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage
        run: |
          python -m coverage combine coverage-data
          python -m coverage report
          python -m coverage xml

      - name: Report and enforce coverage quality
        run: >-
          python scripts/coverage_quality.py
          --coverage-xml coverage.xml
          --head "${{ github.event.pull_request.head.sha || github.sha }}"
          --json-output coverage-quality.json
          --markdown-output coverage-quality.md
          --github-summary "$GITHUB_STEP_SUMMARY"
          --enforce

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: |
            coverage.xml
            coverage-quality.json
            coverage-quality.md
          if-no-files-found: error
          retention-days: 14

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install auditable dependencies
        run: |
          python -m pip install --upgrade \
            "pip>=26.1.2,<27" \
            "setuptools>=83,<85"
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0+cpu"
          python -m pip install -r requirements.txt

      - name: Dependency audit
        run: python -m pip_audit --local

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Build production container
    runs-on: ubuntu-latest
    needs:
      - lint-type-unit
      - postgres-integration
      - postgres-restart-e2e
      - coverage-report
      - security-audit
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build --target production -t portfolio-pilot:ci .
